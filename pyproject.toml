[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jukefa-asmgen"
version = "0.6.3"
authors = [
{ name="linedot", email="linedot@linedot.org" },
]
description = "Assembly Generation tool for AVX/FMA, AVX2, AVX512, ARM NEON, ARM SVE, ARM SME, RISCV RVV"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = [
  "Mako"
]

[tool.hatch.build.targets.wheel]
include = ["src/asmgen/py.typed"]
packages = [
  "src/asmgen"
]

[dependency-groups]
test = [
  "pytest>=8",
  "parameterized",
  "pytest-xdist"
]

[project.urls]
Homepage = "https://github.com/FZJ-JSC/jukefa-asmgen"
Issues = "https://github.com/FZJ-JSC/jukefa-asmgen/issues"

[tool.mypy]
python_version = "3.13"
files = ["src"]
mypy_path = "src"
show_error_codes = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
pretty = true
[[tool.mypy.overrides]]
module = ["mako.*" ]
ignore_missing_imports = true
